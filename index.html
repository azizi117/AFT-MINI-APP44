
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOURCE OF LIFE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#070c16;
 color:white;
 font-family:Arial,sans-serif;
 padding:18px;
}
header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:15px 0;
}
.logo{
 color:#20e0c0;
 font-size:22px;
 font-weight:bold;
}
button{
 cursor:pointer;
 border:1px solid #176273;
 border-radius:15px;
 padding:12px;
 color:#fff;
 background:#102337;
}
.card{
 background:linear-gradient(145deg,#12243a,#09111e);
 border:1px solid #15536a;
 border-radius:22px;
 padding:20px;
 margin:18px 0;
 box-shadow:0 0 20px #00cbd522;
}
.coin{
 width:110px;
 height:110px;
 border-radius:50%;
 margin:25px auto;
 display:grid;
 place-items:center;
 font-size:55px;
 font-weight:bold;
 color:#20e0c0;
 border:2px solid #20e0c0;
 box-shadow:0 0 30px #20e0c077;
}
.center{text-align:center}
.balance{
 font-size:36px;
 color:#20e0c0;
 margin:15px;
}
.buttons{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}
.primary{
 background:linear-gradient(90deg,#00a9db,#20e0ad);
 color:#04131a;
 font-weight:bold;
}
nav{
 display:flex;
 justify-content:space-around;
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:#0b1625;
 padding:18px 5px;
 border-top:1px solid #15536a;
}
nav button{font-size:12px}
</style>
</head>
<body>

<header>
 <div class="logo">S SOURCE OF LIFE</div>
 <button onclick="changeLang()">🌐 زبان</button>
</header>

<div class="card center">
 <h3 id="welcome">خوش آمدی به منبع حیات</h3>
 <div class="coin">S</div>
 <p id="balanceText">موجودی آزمایشی</p>
 <div class="balance">282.0113</div>
 <p style="color:#20e0ad">SOLIFE</p>
 <hr style="border-color:#174052">
 <h3 id="mining">استخراج فعال</h3>
 <p>5.4 SOLIFE / Hour</p>
 <div class="buttons">
  <button class="primary" onclick="claim()" id="claim">
   دریافت آزمایشی
  </button>
  <button id="active">استخراج فعال</button>
 </div>
</div>

<div class="card">
 <h3 id="market">قیمت توکن</h3>
 <h2>$0.00180</h2>
 <p style="color:#20e0ad">↗ +3.37%</p>
</div>

<nav>
 <button id="home">خانه</button>
 <button id="tasks">ماموریت‌ها</button>
 <button>ϟ CORE</button>
 <button id="community">جامعه</button>
 <button id="wallet">کیف پول</button>
</nav>

<script>
const languages={
 fa:{
 welcome:"خوش آمدی به منبع حیات",
 balanceText:"موجودی آزمایشی",
 mining:"استخراج فعال",
 claim:"دریافت آزمایشی",
 active:"استخراج فعال",
 market:"قیمت توکن",
 home:"خانه",
 tasks:"ماموریت‌ها",
 community:"جامعه",
 wallet:"کیف پول"
 },
 en:{
 welcome:"Welcome to SOURCE OF LIFE",
 balanceText:"Demo Balance",
 mining:"Mining Active",
 claim:"Demo Claim",
 active:"Mining Active",
 market:"Token Price",
 home:"Home",
 tasks:"Tasks",
 community:"Community",
 wallet:"Wallet"
 },
 ar:{
 welcome:"مرحباً بك في مصدر الحياة",
 balanceText:"الرصيد التجريبي",
 mining:"التعدين نشط",
 claim:"مطالبة تجريبية",
 active:"التعدين نشط",
 market:"سعر العملة",
 home:"الرئيسية",
 tasks:"المهام",
 community:"المجتمع",
 wallet:"المحفظة"
 }
};

let lang="fa";

function changeLang(){
 const keys=["fa","en","ar"];
 lang=keys[(keys.indexOf(lang)+1)%3];
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==="en"?"ltr":"rtl";
 for(const id in languages[lang]){
  const el=document.getElementById(id);
  if(el)el.innerText=languages[lang][id];
 }
}

function claim(){
 alert(lang==="fa"?"این نسخه نمایشی است؛ دریافت واقعی فعال نیست.":
 lang==="en"?"Demo version. Real claims are disabled.":
 "هذه نسخة تجريبية فقط.");
}

if(window.Telegram?.WebApp){
 Telegram.WebApp.ready();
 Telegram.WebApp.expand();
}
</script>
</body>
</html>
